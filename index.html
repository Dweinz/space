<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Space Station</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <header id="res" class="panel bar"></header>

    <aside id="left" class="panel">
      <h2>Crew</h2>
      <div id="crew"></div>
    </aside>

    <aside id="right" class="panel">
      <h2>Research</h2>
      <div id="research"></div>
      <h2>Visitors</h2>
      <div id="ships"></div>
    </aside>

    <footer id="bottom" class="panel">
      <div id="palette"></div>
      <div id="builds"></div>
      <div id="guide"></div>
      <div id="log"></div>
    </footer>

    <nav id="tabs">
      <button data-tab="left">Crew</button>
      <button data-tab="right">Research</button>
      <button data-tab="bottom">Build</button>
    </nav>

    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
